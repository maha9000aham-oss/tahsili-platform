<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصة كريمة بنت همام الذكية</title>

<style>
:root{
  --primary:#c4003a;
  --primary-dark:#8e002a;
  --bg:#fff5f7;
  --card:#ffffff;
  --text:#1f1f1f;
  --shadow:0 10px 25px rgba(0,0,0,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Tahoma","Arial";
  background:linear-gradient(180deg,#fff4f6,#f1eefc);
}

.app{
  width:92%;
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  color:#fff;
  border-radius:20px;
  padding:25px;
  text-align:center;
}

.hero h1{
  margin:0;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:20px;
  margin-top:20px;
  text-align:center;
  box-shadow:var(--shadow);
}

button{
  background:var(--primary);
  color:#fff;
  border:none;
  padding:10px 20px;
  border-radius:8px;
  cursor:pointer;
}

.footer{
  margin-top:30px;
  text-align:center;
  font-size:14px;
  color:#555;
}
</style>

</head>

<body>

<div class="app">

<div class="hero">
<h1>منصة كريمة بنت همام الذكية</h1>
<p>
بقيادة الأستاذة / ابتهال عبدالله الصاملي<br>
إعداد وتصميم وبرمجة / مهاء يوسف الشهراني
</p>
</div>

<div class="card" id="content">
<button onclick="start()">ابدئي الاختبار</button>
</div>

<div class="footer">
رحلة تدريبية ملهمة، نحو أداءٍ متميز ومستقبلٍ واعد، انسجامًا مع رؤية السعودية 2030
</div>

</div>

<script>
function start(){
  document.getElementById("content").innerHTML = `
    <h2>سؤال تجريبي</h2>
    <p>ما ناتج 2 + 2 ؟</p>

    <button onclick="answer(3)">3</button>
    <button onclick="answer(4)">4</button>
    <button onclick="answer(5)">5</button>
  `;
}

function answer(val){
  if(val === 4){
    alert("إجابة صحيحة");
  }else{
    alert("إجابة خاطئة");
  }
}
</script>

</body>
</html>
