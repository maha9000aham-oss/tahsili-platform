<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة التحصيلي الذكية</title>

<style>
body{
  font-family: Arial;
  background:#f5f5f5;
  margin:0;
  text-align:center;
}
header{
  background:#4b2aad;
  color:#fff;
  padding:20px;
  font-size:22px;
}
.container{
  padding:20px;
}
button{
  padding:12px 20px;
  margin:10px;
  border:none;
  border-radius:10px;
  background:#6c4cf1;
  color:#fff;
  font-size:16px;
}
.question{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}
</style>
</head>

<body>

<header>منصة التحصيلي الذكية</header>

<div class="container">
  <button onclick="start()">ابدأ الاختبار</button>

  <div id="quiz"></div>
</div>

<script>
let qIndex = 0;
let score = 0;

const questions = [
  {
    q:"ما ناتج 2 + 2 ؟",
    options:["3","4","5"],
    answer:1
  },
  {
    q:"وحدة قياس القوة هي؟",
    options:["نيوتن","متر","كجم"],
    answer:0
  }
];

function start(){
  qIndex=0;
  score=0;
  showQ();
}

function showQ(){
  let q = questions[qIndex];
  let html = "<div class='question'><h3>"+q.q+"</h3>";

  q.options.forEach((opt,i)=>{
    html += `<button onclick="check(${i})">${opt}</button>`;
  });

  html += "</div>";
  document.getElementById("quiz").innerHTML = html;
}

function check(i){
  if(i === questions[qIndex].answer){
    score++;
  }
  qIndex++;
  if(qIndex < questions.length){
    showQ();
  }else{
    document.getElementById("quiz").innerHTML =
      "<h2>انتهى الاختبار</h2><p>درجتك: "+score+"</p>";
  }
}
</script>

</body>
</html>
