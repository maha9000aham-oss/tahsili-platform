<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --primary:#c4003a;
  --primary-dark:#8e002a;
  --bg:#fff5f7;
  --card:#ffffff;
  --text:#1f1f1f;
  --shadow:0 10px 25px rgba(0,0,0,.08);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:"Tahoma","Arial",sans-serif;
  background:linear-gradient(180deg,#fff4f6 0%,#f1eefc 100%);
  color:var(--text);
  min-height:100vh;
}

.app{
  width:min(1100px,92%);
  margin:0 auto;
  padding:24px 0 40px;
}

.hero{
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  color:#fff;
  border-radius:24px;
  padding:30px 20px;
  text-align:center;
  box-shadow:var(--shadow);
}

.hero h1{
  margin:0;
  font-size:26px;
}

.hero p{
  margin-top:10px;
  font-size:14px;
}

button{
  padding:12px 25px;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  margin-top:20px;
  box-shadow:var(--shadow);
  text-align:center;
}

.footer{
  margin-top:30px;
  text-align:center;
  font-size:14px;
  color:#555;
}
</style>

</head>

<body>

<div class="app">

  <section class="hero">
    <h1>منصة كريمة بنت همام الذكية</h1>
    <p>
      بقيادة الأستاذة / ابتهال عبدالله الصاملي<br>
      إعداد وتصميم وبرمجة المنصة / مهاء يوسف الشهراني
    </p>
  </section>

  <div class="card">
    <button>ابدئي الاختبار</button>
  </div>

  <div class="footer">
    رحلة تدريبية ملهمة، نحو أداءٍ متميز ومستقبلٍ واعد، انسجامًا مع مستهدفات رؤية السعودية 2030.
  </div>

</div>

<script>
